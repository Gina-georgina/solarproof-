name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
    - cron: '0 3 * * 1'   # weekly verification at 03:00 UTC on Mondays
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump
        run: sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION }}
          SLACK_BACKUP_WEBHOOK: ${{ secrets.SLACK_BACKUP_WEBHOOK }}
        run: bash scripts/backup-db.sh

  verify-restore:
    name: Verify backup restore
    needs: backup
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
      SUPABASE_REGION: ${{ vars.SUPABASE_VERIFY_REGION }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_VERIFY_DB_PASSWORD }}
      SLACK_BACKUP_WEBHOOK: ${{ secrets.SLACK_BACKUP_WEBHOOK }}
      RTO_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client and jq
        run: sudo apt-get install -y postgresql-client jq

      - name: Download latest backup from S3
        run: |
          set -euo pipefail
          LATEST_KEY=$(aws s3 ls "s3://${S3_BUCKET}/backups/" | sort | tail -n 1 | awk '{print $4}')
          if [ -z "${LATEST_KEY}" ]; then
            echo "No backup found in s3://${S3_BUCKET}/backups/" >&2
            exit 1
          fi
          echo "Latest backup: ${LATEST_KEY}"
          aws s3 cp "s3://${S3_BUCKET}/backups/${LATEST_KEY}" ./latest-backup.dump
          echo "BACKUP_FILE=./latest-backup.dump" >> "$GITHUB_ENV"

      - name: Create throwaway Supabase project
        id: create-project
        run: |
          set -euo pipefail
          PROJECT_NAME="verify-restore-$(date +%s)"
          RESPONSE=$(curl -sS -f -X POST "https://api.supabase.com/v1/projects" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"organization_id\":\"${SUPABASE_ORG_ID}\",\"name\":\"${PROJECT_NAME}\",\"region\":\"${SUPABASE_REGION}\",\"db_pass\":\"${SUPABASE_DB_PASSWORD}\"}")
          PROJECT_REF=$(echo "${RESPONSE}" | jq -r '.id')
          if [ -z "${PROJECT_REF}" ] || [ "${PROJECT_REF}" = "null" ]; then
            echo "Failed to create throwaway project: ${RESPONSE}" >&2
            exit 1
          fi
          echo "Created throwaway project: ${PROJECT_REF}"
          echo "PROJECT_REF=${PROJECT_REF}" >> "$GITHUB_ENV"

      - name: Wait for project to become available
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(curl -sS -f "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -r '.status')
            echo "Attempt ${i}: status=${STATUS}"
            if [ "${STATUS}" = "ACTIVE_HEALTHY" ]; then
              echo "Project is available"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for project ${PROJECT_REF} to become available" >&2
          exit 1

      - name: Restore backup and run smoke queries
        id: restore
        run: |
          set -euo pipefail
          START=$(date +%s)
          DB_HOST="db.${PROJECT_REF}.supabase.co"
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
          pg_restore --no-owner --no-privileges --clean --if-exists \
            -h "${DB_HOST}" -p 5432 -U postgres -d postgres "${BACKUP_FILE}"
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Restore elapsed: ${ELAPSED}s"
          echo "ELAPSED=${ELAPSED}" >> "$GITHUB_ENV"

          echo "Running smoke queries..."
          psql -h "${DB_HOST}" -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'readings' AS table_name, count(*) AS row_count FROM readings;
          SELECT 'certificates' AS table_name, count(*) AS row_count FROM certificates;
          SELECT 'meters' AS table_name, count(*) AS row_count FROM meters;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM meters) = 0 THEN
              RAISE EXCEPTION 'Smoke check failed: meters table is empty';
            END IF;
            IF (SELECT count(*) FROM readings) = 0 THEN
              RAISE EXCEPTION 'Smoke check failed: readings table is empty';
            END IF;
          END $$;
          SQL
          echo "Smoke queries passed"

      - name: Check RTO target
        run: |
          set -euo pipefail
          if [ "${ELAPSED}" -gt "${RTO_SECONDS}" ]; then
            echo "Restore time ${ELAPSED}s exceeds RTO target ${RTO_SECONDS}s" >&2
            exit 1
          fi
          echo "Restore time ${ELAPSED}s is within RTO target ${RTO_SECONDS}s"

      - name: Send Slack alert on failure
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BACKUP_WEBHOOK:-}" ]; then
            echo "SLACK_BACKUP_WEBHOOK not set; skipping alert"
            exit 0
          fi
          curl -sS -X POST "${SLACK_BACKUP_WEBHOOK}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: Backup restore verification FAILED for run ${GITHUB_RUN_ID}. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Delete throwaway project
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_REF:-}" ]; then
            echo "No throwaway project to delete"
            exit 0
          fi
          curl -sS -f -X DELETE "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" || true
          echo "Deleted throwaway project ${PROJECT_REF}"