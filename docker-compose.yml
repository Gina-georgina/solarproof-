version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
    env_file:
      - .env.local
    depends_on:
      supabase-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service"
        env: "NODE_ENV"

  log-shipper:
    image: fluent/fluent-bit:3.1
    profiles:
      - logging
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      - LOG_SHIPPER_ENDPOINT=${LOG_SHIPPER_ENDPOINT:-}
      - LOG_SHIPPER_TOKEN=${LOG_SHIPPER_TOKEN:-}
      - LOG_SHIPPER_BACKEND=${LOG_SHIPPER_BACKEND:-loki}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]

  supabase-db:
    image: supabase/postgres:15.1.0.147
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solarproof
    volumes:
      - supabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solarproof"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-queue:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  supabase_data:
  redis_cache_data:
  redis_queue_data:
